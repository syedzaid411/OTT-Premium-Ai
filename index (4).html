<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OTT Premium AI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--mut:#9aa3b8;--blue:#0072d2}
*{box-sizing:border-box;margin:0}
html,body{background:#040714}
body{background:radial-gradient(ellipse 80% 40% at 50% 0,#1a2a66 0,transparent 70%),#040714;color:#f9f9f9;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:linear-gradient(180deg,rgba(4,7,20,.95),rgba(4,7,20,.6));backdrop-filter:blur(12px)}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;direction:ltr;text-shadow:0 0 22px #2a6bff}
.logo i{font-style:normal;background:linear-gradient(90deg,#4da3ff,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1;min-width:130px;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:24px;padding:9px 16px;outline:0;transition:.2s}
#q:focus{background:rgba(255,255,255,.14);border-color:#fff}
.b{background:rgba(255,255,255,.1);border:1px solid transparent;border-radius:22px;padding:8px 15px;cursor:pointer;transition:.2s;white-space:nowrap}
.b:hover{background:#f9f9f9;color:#040714}
.b:focus-visible,.c:focus-visible,.pt:focus-visible{outline:2px solid #fff;outline-offset:2px}
.b.p{background:linear-gradient(90deg,#0072d2,#5b4bff);font-weight:700}
.b.p:hover{background:#f9f9f9;color:#040714}
select{background:#0d1226;border:1px solid #2c3350;border-radius:10px;padding:7px}
.hero{position:relative;min-height:64vh;display:flex;align-items:flex-end;padding:28px 18px 38px;background:var(--hb) center/cover}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#040714 3%,rgba(4,7,20,.15) 55%,rgba(4,7,20,.5)),linear-gradient(270deg,rgba(4,7,20,.9),transparent 75%)}
.hero>div{position:relative;max-width:560px}
.tag{display:inline-block;background:rgba(255,255,255,.14);border-radius:6px;padding:3px 10px;font-size:13px;backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(32px,7vw,56px);font-weight:900;line-height:1.1;margin:10px 0;direction:ltr;text-align:right;text-shadow:0 4px 24px #000}
.hero p{color:#dfe6ff;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;direction:ltr;text-align:left;margin-bottom:16px}
.hero .b{padding:11px 22px;margin-inline-end:8px}
main{padding:0 16px 10px}
h2{font-size:19px;font-weight:700;margin:26px 0 10px}
.r{display:flex;gap:14px;overflow-x:auto;padding:8px 4px 16px;scroll-snap-type:x proximity;direction:ltr;scrollbar-width:none}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;direction:ltr;padding:6px 0}
.c{position:relative;flex:0 0 auto;width:150px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;cursor:pointer;background:#1a1d29;border:2px solid rgba(255,255,255,.08);transition:transform .3s,border-color .3s,box-shadow .3s;scroll-snap-align:start}
.g .c{width:auto}
.c:hover{transform:scale(1.08);border-color:#f9f9f9;box-shadow:0 14px 34px rgba(0,0,0,.7);z-index:2}
.c img{display:block;width:100%;height:100%;object-fit:cover}
.c span{position:absolute;inset:auto 0 0;padding:26px 9px 9px;font-size:13px;font-weight:700;line-height:1.3;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent);opacity:0;transition:.3s;text-align:left}
.c:hover span,.c.d span{opacity:1}
.c b{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);border-radius:8px;padding:2px 7px;font-size:12px;color:#ffd24d}
.pt{flex:0 0 auto;width:158px;height:88px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--k),#0a0e22 85%);border:2px solid rgba(255,255,255,.14);cursor:pointer;transition:.3s}
.pt:hover{border-color:#fff;transform:scale(1.06)}
#gate,#md{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
#gate{background:radial-gradient(circle at 50% 28%,#26398a,#040714 68%);flex-direction:column;gap:14px;text-align:center}
#gate .logo{font-size:clamp(34px,10vw,54px)}
#gate input{width:min(310px,90%);text-align:center;background:rgba(255,255,255,.08);border:1px solid #3a4470;border-radius:14px;padding:14px;letter-spacing:3px;font-size:18px;direction:ltr;outline:0}
#gate input:focus{border-color:#fff}
#ge{color:#ff6b6b;min-height:20px}
#md{display:none;background:rgba(0,0,0,.82);align-items:flex-start;overflow-y:auto}
.box{background:#0e1226;border:1px solid #2c3350;border-radius:18px;max-width:760px;width:100%;margin:auto;padding:18px;position:relative}
.x{position:absolute;top:10px;left:12px;font-size:22px;cursor:pointer;background:none;border:0}
.top{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}
.top img{width:130px;border-radius:12px;align-self:flex-start}
.top div{flex:1;min-width:200px}
.s{color:var(--mut);font-size:13px;margin:12px 0 6px}
.pv{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
.pv img{width:46px;height:46px;border-radius:11px}
.pp{background:#1d2442;border-radius:10px;padding:10px 13px;font-weight:700;font-size:13px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#ao{white-space:pre-wrap;line-height:1.9;background:#141a34;border-radius:12px;padding:12px;margin-top:8px}
#ao:empty{display:none}
blockquote{background:#141a34;border-radius:10px;padding:10px;margin:8px 0;font-size:14px;line-height:1.7;direction:ltr;text-align:left}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ld{padding:30px;text-align:center}
footer{text-align:center;color:var(--mut);padding:28px 14px 44px;font-size:14px}
footer a{color:#4da3ff;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- themes ---- */
:root,[data-theme=royal]{--bg:#040714;--glow:#1a2a66;--hd:linear-gradient(180deg,rgba(4,7,20,.95),rgba(4,7,20,.6));--lg:linear-gradient(90deg,#4da3ff,#9b7bff);--gl:#2a6bff;--ac:linear-gradient(90deg,#0072d2,#5b4bff);--at:#fff;--sh:rgba(4,7,20,.9);--pn:#0e1226;--pn2:#141a34;--ln:#2c3350;--rd:18px;--rc:12px;--gt:radial-gradient(circle at 50% 28%,#26398a,#040714 68%);--hf:"Segoe UI",Tahoma,system-ui,sans-serif}
[data-theme=crimson]{--bg:#0b0b0d;--glow:#4a0a0e;--hd:linear-gradient(180deg,#000,rgba(0,0,0,.5));--lg:linear-gradient(90deg,#ff3b47,#b20710);--gl:#e50914;--ac:#e50914;--at:#fff;--sh:rgba(0,0,0,.92);--pn:#16161a;--pn2:#202027;--ln:#33333b;--rd:6px;--rc:4px;--gt:radial-gradient(circle at 50% 28%,#5a0a10,#0b0b0d 68%);--hf:Impact,"Arial Narrow",sans-serif}
[data-theme=aurora]{--bg:#120d2e;--glow:#5b3bd6;--hd:rgba(255,255,255,.07);--lg:linear-gradient(90deg,#5ee7df,#b490ff);--gl:#8a63ff;--ac:linear-gradient(90deg,#14b8c6,#8a63ff);--at:#fff;--sh:rgba(18,13,46,.88);--pn:rgba(40,30,95,.82);--pn2:rgba(255,255,255,.09);--ln:rgba(255,255,255,.2);--rd:26px;--rc:20px;--gt:radial-gradient(circle at 30% 20%,#4a2fb8,#120d2e 70%);--hf:"Segoe UI",Tahoma,system-ui,sans-serif}
[data-theme=gold]{--bg:#0c0a07;--glow:#3a2c0c;--hd:linear-gradient(180deg,#0c0a07,rgba(12,10,7,.6));--lg:linear-gradient(90deg,#f6e27a,#c9962b);--gl:#c9962b;--ac:linear-gradient(90deg,#c9962b,#f6e27a);--at:#1a1204;--sh:rgba(12,10,7,.9);--pn:#15110a;--pn2:#1d170d;--ln:#4a3a16;--rd:4px;--rc:2px;--gt:radial-gradient(circle at 50% 28%,#4a3510,#0c0a07 68%);--hf:Georgia,"Times New Roman",serif}
html,body{background:var(--bg)}
body{background:radial-gradient(ellipse 80% 40% at 50% 0,var(--glow) 0,transparent 70%),var(--bg)}
header{background:var(--hd)}
.logo,h2,.hero h1{font-family:var(--hf)}
.logo{text-shadow:0 0 22px var(--gl)}
.logo i{background:var(--lg);-webkit-background-clip:text;background-clip:text;color:transparent}
.b.p{background:var(--ac);color:var(--at)}
.b.p:hover{background:#f9f9f9;color:#040714}
.hero:before{background:linear-gradient(0deg,var(--bg) 3%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.45)),linear-gradient(270deg,var(--sh),transparent 75%)}
.c{border-radius:var(--rc);border-color:var(--ln)}
.pt{border-radius:var(--rc);background:linear-gradient(135deg,var(--k),var(--bg) 85%);border-color:var(--ln)}
.box{background:var(--pn);border-color:var(--ln);border-radius:var(--rd);backdrop-filter:blur(18px)}
#ao,blockquote,.pp{background:var(--pn2)}
select{background:var(--pn);border-color:var(--ln)}
#gate{background:var(--gt)}
</style>
</head>
<body>
<div id="gate">
  <div class="logo">OTT <i>Premium AI</i></div>
  <p>داخل ہونے کے لیے کوڈ لکھیں</p>
  <input id="gc" type="password" placeholder="••••••" autocomplete="off" aria-label="کوڈ">
  <button class="b p" onclick="enter($('#gc').value)">کھولیں</button>
  <div id="ge"></div>
  <footer>Syed Zaid · <a href="https://www.tiktok.com/@syed_zaidz" target="_blank" rel="noopener">TikTok @syed_zaidz</a></footer>
</div>

<header>
  <div class="logo">OTT <i>Premium AI</i></div>
  <input id="q" placeholder="فلم یا سیریز تلاش کریں…" enterkeyhint="search">
  <button class="b p" onclick="$('#sf').click()">📷 اسکین</button>
  <button class="b" onclick="finder()">✨ AI فائنڈر</button>
  <button class="b" onclick="surprise()">🎲 سرپرائز</button>
  <button class="b" onclick="wlist()">❤ لسٹ</button>
  <select id="rg" title="ملک"><option>PK</option><option>IN</option><option>US</option><option>GB</option><option>AE</option><option>SA</option><option>CA</option></select>
  <select id="lg" title="AI زبان"><option value="Urdu (Urdu script)">اردو</option><option value="Hindi (Devanagari script)">हिंदी</option><option value="Roman Urdu">Roman</option><option value="English">English</option></select>
  <select id="th" title="تھیم"><option value="royal">🎨 Royal</option><option value="crimson">🎨 Crimson</option><option value="aurora">🎨 Aurora</option><option value="gold">🎨 Gold</option></select>
  <input id="sf" type="file" accept="image/*" hidden>
</header>
<div id="hero"></div>
<main id="main"></main>
<div id="md" onclick="if(event.target===this)hide()"><div class="box" id="bx"></div></div>
<footer>Developed by Syed Zaid · <a href="https://www.tiktok.com/@syed_zaidz" target="_blank" rel="noopener">TikTok @syed_zaidz</a><br>Data: TMDB</footer>

<script>
const $=s=>document.querySelector(s),IMG="https://image.tmdb.org/t/p/",DEMO="SyedTV123";
const ls={g:k=>{try{return localStorage.getItem(k)}catch{return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let code=ls.g("zc")||"",demo=false,cur={},wl=JSON.parse(ls.g("wl")||"[]");
$("#rg").value=ls.g("rg")||"PK";if(ls.g("lg"))$("#lg").value=ls.g("lg");
const region=()=>$("#rg").value;
const th=$("#th");th.value=ls.g("th")||"royal";document.documentElement.dataset.theme=th.value;th.onchange=()=>{ls.s("th",th.value);document.documentElement.dataset.theme=th.value};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pj=s=>{try{return JSON.parse(s.match(/[\[{][\s\S]*[\]}]/)[0])}catch{return null}};
const GR=["#1e3c72,#2a5298","#42275a,#734b6d","#134e5e,#71b280","#7b4397,#dc2430","#0f2027,#2c5364","#cb2d3e,#ef473a","#355c7d,#c06c84","#141e30,#3a5a8c"];
const T=["Night Signal","Last Monsoon","The Glass City","Red Harbor","Echo Park","Dust & Gold","Iron Dawn","Paper Moon","Silent Line","Crown of Ash","Blue Hour","Wild Orchid"];
function dm(p){
  if(/^\/(movie|tv)\/\d+$/.test(p)){const i=+p.split("/")[2];return{title:T[i%12],overview:"A sample story used in demo mode. Real titles, plots and ratings appear once the site is live with the TMDB key.",genres:[{name:"Thriller"},{name:"Drama"}],vote_average:8.1,vote_count:1240,runtime:118,release_date:"2026-01-01","watch/providers":{results:{[region()]:{flatrate:[{provider_name:"Netflix"},{provider_name:"Prime Video"}],rent:[{provider_name:"YouTube"}]}}},reviews:{results:[{author:"Sample",author_details:{rating:8},content:"Sample review text shown in demo mode."}]},videos:{results:[]}}}
  return{results:T.map((t,i)=>({id:i,title:t,vote_average:7+(i%20)/10,media_type:"movie",overview:"Sample story in demo mode.",demo:1}))}
}
async function api(type,o={}){const r=await fetch("/.netlify/functions/api",{method:"POST",headers:{"x-code":code,"content-type":"application/json"},body:JSON.stringify({type,...o})});if(!r.ok)throw new Error(r.status);return r.json()}
const tm=(path,p={})=>demo?Promise.resolve(dm(path)):api("tmdb",{path,params:{language:"en-US",region:region(),...p}});
const ai=async(content,vision)=>demo?"1) قسم: تیز رفتار تھرلر\n2) کہانی: ایک پراسرار سگنل کی گتھی (بغیر spoiler)\n3) کن کے لیے: سسپنس پسند کرنے والے\n4) کہاں دیکھیں: Netflix\n5) ریٹنگ: 8/10\n\n(یہ ڈیمو جواب ہے، اصل سائٹ پر Groq AI جواب دے گا)":(await api("ai",{vision,messages:[{role:"user",content}]})).choices[0].message.content;
function show(h){$("#bx").innerHTML='<button class="x" onclick="hide()" aria-label="بند">✕</button>'+h;$("#md").style.display="flex"}
function hide(){$("#md").style.display="none"}
function card(m,t){
  t=m.media_type||t||(m.title?"movie":"tv");if(t==="person"||(!m.poster_path&&!m.demo))return"";
  const n=esc(m.title||m.name),im=m.poster_path?`<img loading="lazy" alt="${n}" src="${IMG}w342${m.poster_path}">`:`<div style="height:100%;background:linear-gradient(160deg,${GR[m.id%8]})"></div>`;
  return`<div class="c${m.poster_path?"":" d"}" tabindex="0" onclick="det('${t}',${m.id})" onkeydown="if(event.key==='Enter')this.click()">${im}<b>★${(m.vote_average||0).toFixed(1)}</b><span>${n}</span></div>`}
function ok(){$("#gate").style.display="none";home()}
async function enter(c){code=c.trim();try{await api("check");ls.s("zc",code);ok()}catch(e){if(code===DEMO&&e.message!=="401"){demo=true;ok()}else{code="";$("#ge").textContent="کوڈ غلط ہے، دوبارہ کوشش کریں"}}}
$("#gc").onkeydown=e=>{if(e.key==="Enter")enter(e.target.value)};
const PR=[["Netflix",8,"#e50914"],["Prime Video",119,"#00a8e1"],["Disney+ Hotstar",122,"#1b4fd6"],["Disney+",337,"#113ccf"],["Apple TV+",350,"#555"],["JioCinema",220,"#d6006c"]];
const rows=[["🔥 ٹرینڈنگ","/trending/all/week"],["🎬 آنے والی فلمیں","/movie/upcoming"],["⭐ ٹاپ فلمیں","/movie/top_rated"],["📺 ٹاپ سیریز","/tv/top_rated"],["📡 آن ایئر سیریز","/tv/on_the_air"]];
async function home(){
  $("#hero").innerHTML="";
  $("#main").innerHTML=`<h2>📡 OTT چینلز</h2><div class="r">${PR.map(p=>`<div class="pt" tabindex="0" style="--k:${p[2]}" onclick="byProv(${p[1]},'${p[0]}')" onkeydown="if(event.key==='Enter')this.click()">${p[0]}</div>`).join("")}</div><div id="rows"></div>`;
  tm("/trending/all/week").then(d=>{const m=d.results.find(x=>x.media_type!=="person"&&(x.backdrop_path||x.demo));if(!m)return;const t=m.media_type||"movie",n=esc(m.title||m.name);
    $("#hero").innerHTML=`<div class="hero" style="--hb:${m.backdrop_path?`url(${IMG}w1280${m.backdrop_path})`:`linear-gradient(120deg,#0b1d4d,#3a1c71 60%,#d76d77)`}"><div><span class="tag">🔥 آج کی نمبر 1 ٹرینڈنگ</span><h1>${n}</h1><p>${esc(m.overview)}</p><button class="b p" onclick="det('${t}',${m.id})">▶ تفصیل اور کہاں دیکھیں</button><button class="b" onclick="$('#sf').click()">📷 اسکین</button></div></div>`}).catch(()=>{});
  for(const[n,p]of rows){try{const d=await tm(p);$("#rows").insertAdjacentHTML("beforeend",`<h2>${n}</h2><div class="r">${d.results.map(m=>card(m,p.startsWith("/tv/")?"tv":"movie")).join("")}</div>`)}catch{}}
}
async function byProv(id,n){
  $("#hero").innerHTML="";$("#main").innerHTML=`<h2><button class="b" onclick="home()">→ ہوم</button> ${esc(n)} · ${region()}</h2>`;
  for(const[t,l]of[["movie","فلمیں"],["tv","سیریز"]]){try{const d=await tm("/discover/"+t,{with_watch_providers:id,watch_region:region(),sort_by:"popularity.desc"});$("#main").insertAdjacentHTML("beforeend",`<h2>${l}</h2><div class="g">${d.results.map(m=>card(m,t)).join("")||"<p class=s>کچھ نہیں ملا</p>"}</div>`)}catch{}}
  scrollTo(0,0)}
$("#rg").onchange=()=>{ls.s("rg",region());home()};
$("#lg").onchange=()=>ls.s("lg",$("#lg").value);
let st;$("#q").oninput=e=>{clearTimeout(st);const v=e.target.value.trim();st=setTimeout(async()=>{if(!v)return home();$("#hero").innerHTML="";const d=await tm("/search/multi",{query:v});$("#main").innerHTML=`<h2>نتائج: ${esc(v)}</h2><div class="g">${d.results.map(m=>card(m)).join("")||"<p class=s>کچھ نہیں ملا</p>"}</div>`},450)};
async function det(t,id){
  show('<p class="ld">لوڈ ہو رہا ہے…</p>');
  const m=await tm(`/${t}/${id}`,{append_to_response:"watch/providers,reviews,videos"});
  const n=m.title||m.name,yr=(m.release_date||m.first_air_date||"").slice(0,4),pv=(m["watch/providers"].results||{})[region()]||{};
  const grp=(k,l)=>pv[k]?`<div class="s">${l}</div><div class="pv">${pv[k].map(x=>x.logo_path?`<img title="${esc(x.provider_name)}" alt="${esc(x.provider_name)}" src="${IMG}w92${x.logo_path}">`:`<span class="pp">${esc(x.provider_name)}</span>`).join("")}</div>`:"";
  const names=[...(pv.flatrate||[]),...(pv.rent||[]),...(pv.buy||[])].map(x=>x.provider_name);
  const vid=(m.videos.results.find(v=>v.type==="Trailer"&&v.site==="YouTube")||{}).key;
  const rv=m.reviews.results.slice(0,3).map(r=>`<blockquote><b>${esc(r.author)}</b>${r.author_details.rating?" ★"+r.author_details.rating:""}<br>${esc(r.content.slice(0,260))}…</blockquote>`).join("")||'<p class="s">ابھی کوئی ریویو نہیں</p>';
  cur={n,t,id,yr,o:m.overview,g:m.genres.map(x=>x.name).join(", "),r:m.vote_average,pl:names,p:m.poster_path};
  const inw=wl.some(x=>x.id===id&&x.t===t);
  show(`<div class="top">${m.poster_path?`<img src="${IMG}w342${m.poster_path}" alt="">`:""}<div><h2 style="margin:0">${esc(n)} <small style="color:var(--mut)">${yr}</small></h2>
  <p class="s">${esc(cur.g)} · ★ ${(m.vote_average||0).toFixed(1)} (${m.vote_count} ووٹ)${m.runtime?` · ${m.runtime} منٹ`:""}${m.number_of_seasons?` · ${m.number_of_seasons} سیزن`:""}</p>
  <p style="line-height:1.7;direction:ltr;text-align:left">${esc(m.overview)||"—"}</p></div></div>
  <div class="s">${region()} میں کہاں دیکھیں</div>${grp("flatrate","سبسکرپشن")+grp("rent","کرائے پر")+grp("buy","خریدیں")}
  ${names.length?"":`<p class="s">اس ملک میں ابھی کوئی پلیٹ فارم نہیں ملا${pv.link?` — <a href="${pv.link}" target="_blank" rel="noopener" style="color:#4da3ff">JustWatch</a>`:""}</p>`}
  <div class="act"><button class="b p" onclick="ask()">🤖 AI سے پوچھو</button>${vid?`<button class="b" onclick="this.outerHTML='<iframe allowfullscreen src=https://www.youtube.com/embed/${vid}></iframe>'">▶ ٹریلر</button>`:""}<button class="b" id="wb" onclick="tog()">${inw?"💔 لسٹ سے ہٹائیں":"❤ لسٹ میں ڈالیں"}</button></div>
  <div id="ao"></div><div class="s">ریویوز</div>${rv}`);
}
async function ask(){
  const o=$("#ao");o.textContent="🤖 AI سوچ رہا ہے…";
  try{o.textContent=await ai(`You are a movie expert. Reply in ${$("#lg").value}. Title: ${cur.n} (${cur.yr}), ${cur.t==="tv"?"TV series":"movie"}. Genres: ${cur.g}. TMDB rating: ${cur.r}. Plot: ${cur.o}. Available on (${region()}): ${cur.pl.join(", ")||"unknown"}.
Give short, clear points: 1) what type/mood it is 2) story in 2 lines, NO spoilers 3) who should watch / who should skip 4) where to watch (only from the platforms listed) 5) verdict out of 10.`)}catch{o.textContent="AI جواب نہیں دے سکا، دوبارہ کوشش کریں"}
}
function tog(){const i=wl.findIndex(x=>x.id===cur.id&&x.t===cur.t);i>=0?wl.splice(i,1):wl.push({id:cur.id,t:cur.t,poster_path:cur.p,vote_average:cur.r,title:cur.n,demo:demo?1:0});ls.s("wl",JSON.stringify(wl));$("#wb").textContent=i>=0?"❤ لسٹ میں ڈالیں":"💔 لسٹ سے ہٹائیں"}
function wlist(){show(`<h2>❤ میری لسٹ</h2>${wl.length?`<div class="g">${wl.map(m=>card(m,m.t)).join("")}</div>`:'<p class="s">لسٹ خالی ہے۔ کسی فلم میں "لسٹ میں ڈالیں" دبائیں۔</p>'}`)}
async function surprise(){const d=await tm("/trending/all/week");const l=d.results.filter(m=>m.media_type!=="person");const m=l[Math.random()*l.length|0];det(m.media_type||"movie",m.id)}
async function resolve(j){const t=j.type==="tv"?"tv":"movie";const d=await tm("/search/"+t,{query:j.title,...(t==="movie"&&j.year?{year:j.year}:{})});return d.results[0]?{...d.results[0],media_type:t}:null}
$("#sf").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(demo)return show('<p class="ld">ڈیمو موڈ میں اسکین بند ہے۔ اصل سائٹ پر Groq AI تصویر پہچانے گا۔</p>');
  show('<p class="ld">📷 AI اسکین کر رہا ہے…</p>');
  try{
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
    const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const j=pj(await ai([{type:"text",text:'Identify the movie or TV series shown in this image (poster, screenshot, scene, or photo of a screen). Reply ONLY with JSON: {"title":"...","type":"movie or tv","year":"..."} or {"title":null} if unsure.'},{type:"image_url",image_url:{url:c.toDataURL("image/jpeg",.8)}}],true));
    const m=j&&j.title?await resolve(j):null;
    if(!m)return show('<p class="ld">پہچان نہیں سکا۔ پوسٹر یا واضح سین کی تصویر آزمائیں۔</p>');
    det(m.media_type,m.id);
  }catch{show('<p class="ld">اسکین نہیں ہو سکا، دوبارہ کوشش کریں۔</p>')}
};
function finder(){show(`<h2>✨ AI فائنڈر</h2><p class="s">جس قسم کی فلم یا سیریز چاہیے لکھیں، یا نیچے سے چنیں</p>
<input id="fq" style="width:100%;background:rgba(255,255,255,.08);border:1px solid #2c3350;border-radius:12px;padding:11px" placeholder="مثلاً: رات کو دیکھنے کے لیے تھرلر، کوئی ٹوئسٹ والی" onkeydown="if(event.key==='Enter')find(this.value)">
<div class="chips">${["Thriller","Comedy","Romantic","Horror","Sci-Fi","Action","Family","Korean drama","Crime series","Anime"].map(x=>`<button class="b" onclick="find('${x}')">${x}</button>`).join("")}</div><div id="fr"></div>`)}
async function find(q){
  if(!q.trim())return;const o=$("#fr");o.innerHTML='<p class="ld">🔎 AI ڈھونڈ رہا ہے…</p>';
  try{
    if(demo){o.innerHTML=`<div class="g">${dm("/x").results.map(m=>card(m)).join("")}</div><p class="s">ڈیمو نتائج، اصل سائٹ پر AI آپ کے لکھے کے مطابق ڈھونڈے گا</p>`;return}
    const a=pj(await ai(`Suggest 10 real, well-known movies or TV series matching: "${q}". Mix recent and classic, good ratings. Reply ONLY with a JSON array: [{"title":"","type":"movie or tv","year":""}]`));
    const l=(await Promise.all((a||[]).map(resolve))).filter(Boolean);
    o.innerHTML=l.length?`<div class="g">${l.map(m=>card(m)).join("")}</div>`:'<p class="s">کچھ نہیں ملا، کوئی اور وضاحت لکھیں</p>';
  }catch{o.innerHTML='<p class="s">AI جواب نہیں دے سکا، دوبارہ کوشش کریں</p>'}
}
if(code)enter(code);
</script>
